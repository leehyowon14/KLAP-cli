name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Go test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          test -z "$unformatted" || {
            echo "$unformatted"
            exit 1
          }

  lint:
    name: Go lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2

  swift-bridge:
    uses: ./.github/workflows/bridge-artifacts.yml

  release-package:
    name: Release package verification
    needs: swift-bridge
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: macos-bridges
          path: ${{ runner.temp }}/klap-bridge-artifact

      - name: Unpack verified bridges without rebuilding
        run: |
          mkdir -p bridges/macos/.build/artifacts
          tar -xf "$RUNNER_TEMP/klap-bridge-artifact/klap-bridges.tar" -C bridges/macos/.build/artifacts

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

      - name: Build snapshot archives
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish

      - name: Verify archive manifests and native artifact
        run: bash scripts/verify-release-archives.sh

      - name: Test rejection of incomplete or substituted artifacts
        run: bash scripts/test-release-archives.sh
