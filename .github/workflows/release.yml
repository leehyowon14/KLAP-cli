name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  swift-bridge:
    uses: ./.github/workflows/bridge-artifacts.yml

  release:
    name: GoReleaser
    needs: swift-bridge
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: macos-bridges
          path: ${{ runner.temp }}/klap-bridge-artifact

      - name: Unpack verified bridges without rebuilding
        run: |
          mkdir -p bridges/macos/.build/artifacts
          tar -xf "$RUNNER_TEMP/klap-bridge-artifact/klap-bridges.tar" -C bridges/macos/.build/artifacts

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

      - name: Verify snapshot packaging before publishing
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish

      - name: Verify archives against downloaded bridge artifacts
        run: bash scripts/verify-release-archives.sh

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
