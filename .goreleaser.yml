version: 2

project_name: klap

builds:
  - id: klap
    main: ./cmd/klap
    binary: klap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

  - id: klap-macos
    main: ./cmd/klap
    binary: klap
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: klap
    ids:
      - klap
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - docs/ARCHITECTURE.md
  - id: klap-macos
    ids:
      - klap-macos
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - docs/ARCHITECTURE.md
      - src: bridges/macos/.build/artifacts/ReminderBridge
        dst: bridges/macos/ReminderBridge
      - src: bridges/macos/.build/artifacts/CalendarBridge
        dst: bridges/macos/CalendarBridge
      - src: bridges/macos/.build/artifacts/CategoryBridge
        dst: bridges/macos/CategoryBridge
      - src: bridges/macos/.build/artifacts/TranscriptBridge
        dst: bridges/macos/TranscriptBridge

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: leehyowon14
    name: KLAP-cli
  draft: true
  prerelease: auto

homebrew_casks:
  - name: klap
    ids:
      - klap-macos
    binaries:
      - klap
    repository:
      owner: leehyowon14
      name: homebrew-klap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/leehyowon14/KLAP-cli
    description: Kwangwoon Learning Automation Project CLI/TUI
    license: MIT
